name: تحديث شبكات المطر (CHIRPS + GFS)

on:
  schedule:
    - cron: "17 */6 * * *"    # كل 6 ساعات (أقصى تكرار مجاني)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: استرجاع كاش CHIRPS (تسريع التشغيلات اللاحقة)
        uses: actions/cache@v4
        with:
          path: data/tiles/cache
          key: chirps-cache-${{ github.run_id }}
          restore-keys: |
            chirps-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: تثبيت اعتماديات الـ API
        run: pip install -e apps/api

      - name: توليد الشبكات الثابتة
        run: python3 tools/build_grids.py

      - name: رفع الشبكات المحدّثة
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/grids
          if git diff --cached --quiet; then
            echo "لا تغييرات في الشبكات"
          else
            git commit -m "grids: تحديث $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
