name: نشر الموقع على GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: تثبيت الاعتماديات وبناء التصدير الساكن
        working-directory: apps/web
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC_GRIDS: "1"
          PAGES_BASE: /raintracker
          NEXT_PUBLIC_BASEPATH: /raintracker
        run: |
          npm ci
          npx next build

      - name: إلحاق شبكات المطر الثابتة بالمخرجات
        run: |
          mkdir -p apps/web/out/data
          cp -r data/grids apps/web/out/data/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
