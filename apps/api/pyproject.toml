[project]
name = "raintracker-api"
version = "0.1.0"
description = "منصة مطر — REST API لبيانات الأمطار التاريخية وطبقات الصحراء"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "SQLAlchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "PyJWT>=2.8",
  "bcrypt>=4.1,<6",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "rasterio>=1.3.10",
  "numpy>=2.0",
  "cfgrib>=0.9.14",
  "xarray>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
